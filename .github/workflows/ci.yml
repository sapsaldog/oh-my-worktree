name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build, Test & Coverage
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Coverage gate self-test
        run: python3 scripts/check-coverage.py --self-test

      - name: Build & Test (with coverage)
        run: |
          rm -rf build/CoverageResult.xcresult
          xcodebuild test \
            -project OhMyWorktree.xcodeproj \
            -scheme OhMyWorktreeTests \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/CoverageResult.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: CI variance characterization (TEMP)
        run: |
          XCFLAGS="-project OhMyWorktree.xcodeproj -scheme OhMyWorktreeTests -destination platform=macOS -enableCodeCoverage YES -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          echo "DUMP1_START"; python3 scripts/check-coverage.py --dump build/CoverageResult.xcresult; echo "DUMP1_END"
          xcodebuild test-without-building $XCFLAGS -resultBundlePath build/cov2.xcresult >/dev/null 2>&1 || true
          echo "DUMP2_START"; python3 scripts/check-coverage.py --dump build/cov2.xcresult; echo "DUMP2_END"
          xcodebuild test-without-building $XCFLAGS -resultBundlePath build/cov3.xcresult >/dev/null 2>&1 || true
          echo "DUMP3_START"; python3 scripts/check-coverage.py --dump build/cov3.xcresult; echo "DUMP3_END"
