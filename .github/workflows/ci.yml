name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build, Test & Coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Coverage gate self-test
        run: python3 scripts/check-coverage.py --self-test

      - name: Build & Test (with coverage)
        run: |
          # AppDelegateColdStartTests is GUI-coupled: it creates real NSStatusBar
          # status items and displays windows. The headless macOS 26 runner cannot
          # manage those scenes (NSStatusItemScene / render-fence failures) and
          # crashes mid-run, aborting unrelated tests. The suite runs locally via
          # scripts/coverage.sh; coverage stays strict 100% without it here because
          # it only exercises coverage-excluded AppDelegate files.
          rm -rf build/CoverageResult.xcresult
          xcodebuild test \
            -project OhMyWorktree.xcodeproj \
            -scheme OhMyWorktreeTests \
            -destination 'platform=macOS' \
            -skip-testing:OhMyWorktreeTests/AppDelegateColdStartTests \
            -enableCodeCoverage YES \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/CoverageResult.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Coverage gate
        run: python3 scripts/check-coverage.py --check build/CoverageResult.xcresult
