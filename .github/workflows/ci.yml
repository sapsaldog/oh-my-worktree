name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Build, Test & Coverage
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Coverage gate self-test
        run: python3 scripts/check-coverage.py --self-test

      - name: Build & Test (with coverage)
        run: |
          rm -rf build/CoverageResult.xcresult
          xcodebuild test \
            -project OhMyWorktree.xcodeproj \
            -scheme OhMyWorktreeTests \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/CoverageResult.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Coverage diagnostic (TEMP)
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("cc", "scripts/check-coverage.py")
          cc = importlib.util.module_from_spec(spec); spec.loader.exec_module(cc)
          root = cc.repo_root()
          excl = cc.parse_exclude(cc.load_text(root + "/coverage-exclude.txt"))
          files = cc.parse_report(cc.run_xccov("build/CoverageResult.xcresult"), cc.TARGET, root)
          print("CI_COVERAGE_DUMP_START")
          for f in sorted(files, key=lambda x: x["relpath"]):
              tag = "EXCL" if cc.is_excluded(f["relpath"], excl) else "GATE"
              print(f"{f['percent']:.1f}\t{f['covered']}/{f['executable']}\t{tag}\t{f['relpath']}")
          print("CI_COVERAGE_DUMP_END")
          PY

      - name: Coverage gate
        run: python3 scripts/check-coverage.py --check build/CoverageResult.xcresult
