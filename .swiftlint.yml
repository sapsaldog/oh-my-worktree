included:
  - OhMyWorktree
  - OhMyWorktreeTests

excluded:
  - OhMyWorktree.xcodeproj

disabled_rules:
  - trailing_whitespace               # conflicts with Xcode auto-save
  - multiple_closures_with_trailing_closure  # common SwiftUI pattern
  - large_tuple                       # allowed in tests
  - force_try                         # common in test code

opt_in_rules:
  - empty_count             # .count == 0 → .isEmpty
  - sorted_imports          # enforce sorted imports
  - closure_end_indentation
  - first_where             # filter().first → first(where:)

# Short variable names: allowed for common Swift idioms (i, a, b, pr, fd, fm, etc.)
identifier_name:
  min_length:
    warning: 1
    error: 1
  excluded:
    - i
    - id
    - pr    # pull request
    - wt    # worktree
    - fd    # file descriptor
    - fm    # file manager
    - a
    - b
    - c


line_length:
  warning: 130
  error: 200
  ignores_urls: true
  ignores_comments: true

type_body_length:
  warning: 350

function_body_length:
  warning: 60

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 10

nesting:
  type_level:
    warning: 2

custom_rules:
  no_arbitrary_delay:
    regex: "Task\\.sleep\\(|Task\\.yield\\(\\)"
    message: "Avoid arbitrary delays. Use deterministic synchronization (waitUntilIdle, confirmation, pollUntil) or document why a delay is necessary with swiftlint:disable"
    severity: warning
