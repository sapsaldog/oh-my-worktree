<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded rectangle border (Notion-style, thick) -->
  <rect x="4" y="4" width="92" height="92" rx="16" ry="16"
        fill="none" stroke="#000000" stroke-width="8"/>

  <!-- Main Vertical Trunk -->
  <line x1="50" y1="22" x2="50" y2="78" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

  <!-- Left Branch -->
  <path d="M 50 62 C 50 50, 33 52, 33 42" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

  <!-- Right Branch -->
  <path d="M 50 46 C 50 38, 67 39, 67 30" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="50" cy="78" r="5.5" fill="#000000"/>
  <circle cx="50" cy="62" r="5.5" fill="#000000"/>
  <circle cx="50" cy="46" r="5.5" fill="#000000"/>
  <circle cx="50" cy="22" r="5.5" fill="#000000"/>
  <circle cx="33" cy="42" r="5.5" fill="#000000"/>
  <circle cx="67" cy="30" r="5.5" fill="#000000"/>
</svg>