name: OhMyWorktree
options:
  bundleIdPrefix: com.ohmyworktree
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "15.0"
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  PRODUCT_NAME: OhMyWorktree
  INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

targets:
  OhMyWorktree:
    type: application
    platform: macOS
    sources:
      - OhMyWorktree
    dependencies:
      - package: Sparkle
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint > /dev/null; then
            swiftlint
          else
            echo "warning: SwiftLint not installed. Run: brew install swiftlint"
          fi
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Embed Git Commit Hash
        script: |
          GIT_HASH=$(git -C "${PROJECT_DIR}" rev-parse --short HEAD 2>/dev/null || echo "unknown")
          /usr/libexec/PlistBuddy -c "Add :GitCommitHash string ${GIT_HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :GitCommitHash ${GIT_HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        basedOnDependencyAnalysis: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ohmyworktree.app
      INFOPLIST_KEY_CFBundleDisplayName: OhMyWorktree
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
      INFOPLIST_KEY_NSHumanReadableCopyright: ""
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    info:
      path: OhMyWorktree/Info.plist
      properties:
        LSMinimumSystemVersion: "15.0"
        CFBundleName: OhMyWorktree
        CFBundleDisplayName: OhMyWorktree
        CFBundleIdentifier: com.ohmyworktree.app
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.2.4"
        CFBundleVersion: "9"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        SUFeedURL: "https://raw.githubusercontent.com/sapsaldog/oh-my-worktree/main/appcast.xml"
        SUPublicEDKey: "diEC25Ttj2TyM4Q2jRGKiGJrNnMOlhKrfkfVbIIxjSc="

  OhMyWorktreeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OhMyWorktreeTests
    dependencies:
      - target: OhMyWorktree
    settings:
      SWIFT_VERSION: "6.0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      PRODUCT_MODULE_NAME: OhMyWorktreeTests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OhMyWorktree.app/Contents/MacOS/OhMyWorktree"
      BUNDLE_LOADER: "$(TEST_HOST)"
