name: OhMyWorktree
options:
  bundleIdPrefix: com.ohmyworktree
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  PRODUCT_NAME: OhMyWorktree
  INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

targets:
  OhMyWorktree:
    type: application
    platform: macOS
    sources:
      - OhMyWorktree
    dependencies:
      - package: Sparkle
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ohmyworktree.app
      INFOPLIST_KEY_CFBundleDisplayName: OhMyWorktree
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
      INFOPLIST_KEY_NSHumanReadableCopyright: ""
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    info:
      path: OhMyWorktree/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        CFBundleName: OhMyWorktree
        CFBundleDisplayName: OhMyWorktree
        CFBundleIdentifier: com.ohmyworktree.app
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.1.8"
        CFBundleVersion: "6"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        SUFeedURL: "https://raw.githubusercontent.com/sapsaldog/oh-my-worktree/main/appcast.xml"
        SUPublicEDKey: "diEC25Ttj2TyM4Q2jRGKiGJrNnMOlhKrfkfVbIIxjSc="

  OhMyWorktreeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OhMyWorktreeTests
    dependencies:
      - target: OhMyWorktree
    settings:
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      PRODUCT_MODULE_NAME: OhMyWorktreeTests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OhMyWorktree.app/Contents/MacOS/OhMyWorktree"
      BUNDLE_LOADER: "$(TEST_HOST)"
